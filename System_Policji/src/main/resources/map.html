<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mapa patroli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    var map, vectorSource;
    var currentUser = null;
    var patrolPins = {};

  window.updatePatrolPin = function(lon, lat, username) {
    console.log(`updatePatrolPin: ${username} → lat=${lat}, lon=${lon}`);

    if (!vectorSource) {
        console.warn("vectorSource nie jest gotowy!");
        return;
    }

    if (patrolPins[username]) {
        vectorSource.removeFeature(patrolPins[username]);
    }

    const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
    });

    if (username === currentUser) {
        feature.setStyle(new ol.style.Style({
            image: new ol.style.Icon({
                src: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                scale: 0.09,
                anchor: [0.5, 1]
            })
        }));
    }

    vectorSource.addFeature(feature);
    patrolPins[username] = feature;

    if (map) map.render();
    console.log(" Pinezka zaktualizowana dla " + username);
};


    window.clearAllPins = function() {
        console.log(" clearAllPins");
        if (vectorSource) {
            vectorSource.clear();
            patrolPins = {};
        }
    };

    window.loginPolice = function(username) {
        currentUser = username;
        console.log(" Zalogowano policjanta: " + username);
    };

    window.logoutPolice = function() {
        console.log(" Wylogowano");
        currentUser = null;
        clearAllPins();
    };

    function initMap() {
        map = new ol.Map({
            target: 'map',
            layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
            view: new ol.View({
                center: ol.proj.fromLonLat([21.0122, 52.2297]),
                zoom: 10
            })
        });

        vectorSource = new ol.source.Vector();
        map.addLayer(new ol.layer.Vector({
            source: vectorSource
        }));

        map.on('singleclick', function(evt) {
            console.log(" Kliknięto na mapie!");

            if (!currentUser) {
                console.log(" Brak currentUser - nie jesteś zalogowany jako policjant");
                alert("Musisz być zalogowany jako policjant!");
                return;
            }

            const coords = ol.proj.toLonLat(evt.coordinate);
            const lon = coords[0];
            const lat = coords[1];

            console.log(` Kliknięto współrzędne: ${lat}, ${lon} | User: ${currentUser}`);

            if (window.javaBridge) {
                console.log(" javaBridge znaleziony - wywołuję sendLocation...");
                window.javaBridge.sendLocation(lat, lon);
            } else {
                console.error(" javaBridge NIE ISTNIEJE! Most Java-JS nie działa.");
                alert("Błąd: javaBridge nie jest dostępny!");
            }
        });

        console.log(" Mapa OpenLayers zainicjalizowana pomyślnie");
    }

    window.onload = initMap;
</script>
</body>
</html>
