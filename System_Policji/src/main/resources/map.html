<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mapa patroli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Efekt pulsowania pinezki */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    var map, vectorSource;
    var currentUser = null;
    var patrolPins = {};

    // === BARDZO WIDOCZNA PINEZKA DLA PATROLI ===
    window.updatePatrolPin = function(lon, lat, username) {
        console.log(`updatePatrolPin: ${username} → lat=${lat}, lon=${lon}`);

        if (!vectorSource) {
            console.warn("vectorSource nie jest gotowy!");
            return;
        }

        // Usuń starą pinezkę tego użytkownika
        if (patrolPins[username]) {
            vectorSource.removeFeature(patrolPins[username]);
        }

        const feature = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
            username: username
        });

        // Styl dla komendanta / wszystkich patroli
        const patrolStyle = new ol.style.Style({
            image: new ol.style.Icon({
                src: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', // policyjna czapka
                scale: 0.13,           // DUŻO WIĘKSZA
                anchor: [0.5, 1],
                opacity: 1
            }),
            text: new ol.style.Text({
                text: username.length > 8 ? username.substring(0,6) + ".." : username,
                font: 'bold 14px Arial',
                fill: new ol.style.Fill({ color: '#ffffff' }),
                stroke: new ol.style.Stroke({ color: '#000000', width: 4 }),
                offsetY: -55,
                backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.7)' }),
                padding: [3, 6, 3, 6]
            })
        });

        feature.setStyle(patrolStyle);
        vectorSource.addFeature(feature);
        patrolPins[username] = feature;

        if (map) map.render();
        console.log("✓ Duża pinezka patrolu dodana dla: " + username);
    };

    window.clearAllPins = function() {
        console.log(" clearAllPins");
        if (vectorSource) {
            vectorSource.clear();
            patrolPins = {};
        }
    };

    window.loginPolice = function(username) {
        currentUser = username;
        console.log(" Zalogowano policjanta: " + username);
    };

    window.logoutPolice = function() {
        console.log(" Wylogowano");
        currentUser = null;
        clearAllPins();
    };

    function initMap() {
        map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([21.0122, 52.2297]),
                zoom: 10
            })
        });

        vectorSource = new ol.source.Vector();
        map.addLayer(new ol.layer.Vector({
            source: vectorSource,
            style: null // używamy indywidualnych stylów
        }));

        // Kliknięcie na mapie (wysyłanie lokalizacji)
        map.on('singleclick', function(evt) {
            if (!currentUser) {
                alert("Musisz być zalogowany jako policjant!");
                return;
            }

            const coords = ol.proj.toLonLat(evt.coordinate);
            const lon = coords[0];
            const lat = coords[1];

            if (window.javaBridge) {
                window.javaBridge.sendLocation(lat, lon);
            } else {
                console.error("javaBridge nie jest dostępny!");
            }
        });

        console.log("Mapa OpenLayers zainicjalizowana - gotowa na widoczne pinezki");
    }

    window.onload = initMap;
</script>
</body>
</html>
